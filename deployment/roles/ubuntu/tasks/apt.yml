---
- name: "Install miscellaneous apt packages"
  apt: "pkg={{ item }} state=present update-cache=yes"
  with_items:
    - apt-transport-https
    - daemon
    - git
    - git-core
    - libpq-dev
    - libxml2-dev
    - libxslt1-dev
    - libcurl4-gnutls-dev
    - libgnutls28-dev
    - python3-dev
    - python3-pip
    - python3-gpg  # For dropbox. Use python-gpgme for 16.04 or lower.
    - nodejs
    - npm
    - keepass2
    - terminator
    - nautilus-dropbox
    - kdiff3
    - vim
    - tree
    - ack
    - xclip
    - wget
  become: "yes"

# Docker
- name: "Add repo key for docker-ce"
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
  become: "yes"

- name: "Add apt repo for docker-ce"
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu bionic stable"  # bionic is for 18.04
  become: "yes"

- name: "Install docker-ce"
  apt: "pkg=docker-ce state=present update-cache=yes"
  become: "yes"

# yarn
- name: "Add repo key for yarn"
  apt_key:
    url: https://dl.yarnpkg.com/debian/pubkey.gpg
  become: "yes"

- name: "Add apt repo for yarn"
  apt_repository:
    repo: "deb https://dl.yarnpkg.com/debian/ stable main"
  become: "yes"

- name: "Install yarn"
  apt: "pkg=yarn state=present update-cache=yes install_recommends=no"
  become: "yes"

# Sublime
- name: "Add repo key for sublime-text"
  apt_key:
    url: https://download.sublimetext.com/sublimehq-pub.gpg
  become: "yes"

- name: "Add apt repo for sublime-text"
  apt_repository:
    repo: "deb https://download.sublimetext.com/ apt/stable/"
  become: "yes"

- name: "Install sublime-text"
  apt: "pkg=sublime-text state=present update-cache=yes"
  become: "yes"

# VS Code
- name: Add Microsoft GPG key
  shell: |
    wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /usr/share/keyrings/microsoft.gpg
  args:
    creates: /usr/share/keyrings/microsoft.gpg
  become: yes

- name: Add VS Code repository
  copy:
    dest: /etc/apt/sources.list.d/vscode.list
    content: |
      deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/vscode stable main
  become: yes

- name: Update apt cache
  apt:
    update_cache: yes
  become: yes

- name: Install VS Code
  apt:
    name: code
    state: present
  become: yes

# 1password
- name: Add 1Password GPG key
  shell: |
    curl -sS https://downloads.1password.com/linux/keys/1password.asc | gpg --dearmor > /usr/share/keyrings/1password-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/1password-archive-keyring.gpg
  become: yes

- name: Add 1Password repository
  copy:
    dest: /etc/apt/sources.list.d/1password.list
    content: |
      deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main
  become: yes

- name: Add debsig policy (recommended by 1Password)
  shell: |
    mkdir -p /etc/debsig/policies/AC2D62742012EA22/
    curl -sS https://downloads.1password.com/linux/debian/debsig/1password.pol > /etc/debsig/policies/AC2D62742012EA22/1password.pol
    mkdir -p /usr/share/debsig/keyrings/AC2D62742012EA22
    curl -sS https://downloads.1password.com/linux/keys/1password.asc | gpg --dearmor > /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg
  args:
    creates: /etc/debsig/policies/AC2D62742012EA22/1password.pol
  become: yes

- name: Update apt cache
  apt:
    update_cache: yes
  become: yes

- name: Install 1Password
  apt:
    name: 1password
    state: present
  become: yes
