---
- name: Make .ssh directory
  file:
    path: "{{ home_dir }}/.ssh"
    state: directory
    mode: 0755

- name: Add ssh config
  copy:
    src: files/ssh_config
    dest: "{{ home_dir }}/.ssh/config"
    mode: 0644

- name: Append to bash_aliases
  blockinfile:
    path: "{{ home_dir }}/.bash_aliases"
    create: "yes"
    block: |
      alias ll='ls -la'
      alias cg='cd ~/src/git'
